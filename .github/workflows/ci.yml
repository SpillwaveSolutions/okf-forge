# Application quality gate. Deliberately NOT part of worklog.yml: that file is
# scaffolded and re-copied by `worklog init`, so the next upgrade would silently
# delete these jobs. Tool-owned file stays tool-owned.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # node:test over tests/** — the pure-function tier.
      - run: npm test
      # Vite + Nitro/Vercel SSR build. Verified locally before being made a
      # required check. db:migrate no-ops without DATABASE_URL. Writes into
      # .vercel/output/, which is tracked — harmless here since CI never commits.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # cargo test compiles the whole lib crate, which links tauri -> wry ->
      # webkit2gtk. No cheaper path short of splitting fs_core.rs into its own
      # crate. No `paths:` filter on this job: a required check that never
      # reports leaves the PR blocked forever.
      - name: tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run test:rust
